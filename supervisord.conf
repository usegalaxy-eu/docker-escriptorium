[supervisord]
nodaemon=true

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postgres]
; Glob so the command keeps working when the Debian base image moves to a
; newer PostgreSQL major version (bookworm had 15, trixie has 17).
command=/bin/bash -c 'exec /usr/lib/postgresql/*/bin/postgres -D /etc/postgresql/*/main/'
user=postgres
priority=1
startsecs=5
autorestart=true

[program:redis]
command=redis-server
autorestart=true
priority=100

[program:django-init]
command=/bin/bash "/django-init.sh"
directory=/home/escriptorium/escriptorium/app/
user=root
priority=10
autostart=true
startsecs=5
startretries=1
stdout_logfile=/var/log/escriptorium.log
stderr_logfile=/var/log/escriptorium.err

[program:uwsgi]
; wait-for-db.sh waits for django-init to finish (migrations, bootstrap user)
; before serving: requests during the migration window would hit a
; half-migrated database (e.g. "DoesNotExist at /login/" because
; django.contrib.sites has no Site row yet). nginx keeps serving /static/
; in the meantime.
command=/wait-for-db.sh uwsgi --module=escriptorium.wsgi:application --master --processes=%(ENV_UWSGI_PROCESSES)s --http=:8000 --vacuum --die-on-term --static-map /static=/home/escriptorium/escriptorium/app/static --static-map /media=/home/escriptorium/escriptorium/app/media
directory=/home/escriptorium/escriptorium/app
user=escriptorium
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/uwsgi.log
stderr_logfile=/var/log/uwsgi.err

[program:celery-default]
; `wait-for-db` waits for the django-init flag file: workers importing the
; app during the migration window would race a half-migrated database.
command=/wait-for-db.sh celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 --loglevel=info --max-tasks-per-child=10 --concurrency=%(ENV_CELERY_CONCURRENCY)s -Q default,low-priority,live
directory=/home/escriptorium/escriptorium/app/
user=escriptorium
autorestart=true

[program:celery-gpu]
command=/wait-for-db.sh celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 --loglevel=info --max-tasks-per-child=10 --loglevel=info -Q gpu --concurrency=1
directory=/home/escriptorium/escriptorium/app/
user=escriptorium
autorestart=true

[program:celery-jvm]
command=/wait-for-db.sh celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 --loglevel=info --max-tasks-per-child=10 --loglevel=info -Q jvm,intensive-inference --concurrency=1
directory=/home/escriptorium/escriptorium/app/
user=escriptorium
autorestart=true

[program:flower]
command=celery --broker=redis://localhost:6379/0 flower --port=5555
directory=/home/escriptorium
user=escriptorium
autorestart=true
priority=1000


[program:import-data]
; One-shot job: imports files from IMPORT_DIR via the REST API once the
; web server is up. See import-data.py for the supported file types and
; the environment variables it accepts (passed through from the container
; environment, e.g. `docker run -e IMPORT_DOCUMENT_NAME="..."`).
command=python3 /import-data.py
directory=/home/escriptorium/escriptorium/app/
priority=30
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/var/log/escriptorium-import.log
stderr_logfile=/var/log/escriptorium-import.err

[program:export-watcher]
; Long-running job: polls the Downloads API and saves every finished export
; archive into EXPORT_DIR (default /data/export). Used by the Galaxy
; Interactive Tool integration: point EXPORT_DIR at a folder inside the
; Galaxy job working directory and let the tool XML harvest it with
; <discover_datasets>. See export-watcher.py and the README.
;
; priority=1001: supervisord stops processes in reverse priority order, so
; the watcher is stopped FIRST when the container gets SIGTERM (docker stop
; / Galaxy ending the session). That way it receives the signal while the
; API (uwsgi) is still running and can flush finished exports (SIGTERM
; handler + quick flush) instead of dying before saving anything.
; stopwaitsecs gives it time for that flush before SIGKILL.
command=python3 /export-watcher.py
directory=/home/escriptorium/escriptorium/app/
priority=1001
stopwaitsecs=20
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/escriptorium-export.log
stderr_logfile=/var/log/escriptorium-export.err


[program:channelserver]
command=/wait-for-db.sh daphne --bind 0.0.0.0 --port 5000 -v 1 escriptorium.asgi:application
directory=/home/escriptorium/escriptorium/app
user=escriptorium
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/daphne.log
stderr_logfile=/var/log/daphne.err

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10

